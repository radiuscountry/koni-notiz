<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F2F4">
<title>Koni-Notiz</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    color-scheme: light;

    --bg:            #F1F2F4;
    --surface:       #FFFFFF;
    --surface-2:     #E9EAEE;
    --line:          #E3E5E9;

    --ink:           #1B1E23;
    --ink-soft:      #5B6472;
    --ink-faint:     #9AA1AC;

    --brand:         #0E4749;
    --brand-ink:     #FFFFFF;

    --ok:            #2F7D4F;
    --err:           #B3372B;

    --radius-card:   18px;
    --radius-ctl:    12px;
    --shadow-card:   0 1px 2px rgba(20,24,32,.05), 0 4px 16px rgba(20,24,32,.06);

    --pad-page:      16px;      /* einheitliches Seiten-Padding, alle Kanten fluchten daran */
    --dot-grid:      #E8EAEC;   /* Punktraster auf der Textfeld-Karte */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) var(--pad-page) env(safe-area-inset-bottom);
    min-height: 100vh;
    min-height: 100dvh;
  }
  header {
    flex: none;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-mark { flex: none; width: 22px; height: 22px; color: var(--brand); }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  #gear {
    flex: none;
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px;
    background: none; border: none; color: var(--ink-faint);
    margin-right: calc(var(--pad-page) * -1 + 8px);
    cursor: pointer; border-radius: var(--radius-ctl);
  }
  #gear:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--brand); }
  #gear svg { width: 22px; height: 22px; }

  #textwrap {
    flex: 1 1 auto; min-height: 0;
    display: flex; gap: 8px;
  }
  #text {
    flex: 1; width: 100%; resize: none;
    background-color: var(--surface); color: var(--ink);
    background-image: radial-gradient(circle, var(--dot-grid) 1px, transparent 1.6px);
    background-size: 24px 24px;
    border: 1px solid var(--line); border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 14px; font-size: 19px; line-height: 1.4;
    font-family: inherit;
    transition: box-shadow .15s ease-out;
  }
  #text::placeholder { color: var(--ink-faint); }
  #text:focus { outline: none; box-shadow: var(--shadow-card), 0 0 0 2px var(--brand); }

  #foto {
    flex: none; width: 48px; height: 48px; align-self: flex-start;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius-ctl);
    cursor: pointer; transition: box-shadow .15s ease-out;
  }
  #foto:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--brand); }
  #foto svg { width: 20px; height: 20px; }
  #foto:disabled { opacity: 0.5; }

  select#kontext {
    flex: none;
    margin-top: 12px; width: 100%; padding: 12px;
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius-ctl);
    font-family: inherit; font-size: 16px;
  }
  select#kontext:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--brand); }

  #senden {
    flex: none;
    margin-top: 12px; width: 100%; padding: 16px;
    background: var(--brand); color: var(--brand-ink); border: none;
    border-radius: var(--radius-ctl);
    font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
    transition: box-shadow .15s ease-out;
  }
  #senden:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--brand), 0 0 0 4px var(--surface); }
  #senden:disabled { opacity: 0.5; }

  #status {
    flex: none;
    margin-top: 10px; min-height: 20px; font-size: 14px; font-weight: 500;
  }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }

  dialog#settings {
    background: var(--surface); color: var(--ink); border: none;
    border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    padding: 20px; width: min(90vw, 400px);
  }
  dialog#settings::backdrop { background: rgba(27, 30, 35, .35); }
  dialog#settings h2 { margin-top: 0; font-size: 17px; }
  dialog#settings label { display: block; margin-top: 14px; font-size: 13px; color: var(--ink-soft); }
  dialog#settings input {
    width: 100%; margin-top: 6px; padding: 10px;
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: var(--radius-ctl); font-family: inherit; font-size: 15px;
  }
  dialog#settings input:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--brand); }
  dialog#settings .row { display: flex; gap: 10px; margin-top: 18px; }
  dialog#settings button {
    flex: 1; padding: 12px; border-radius: var(--radius-ctl); border: none;
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #save { background: var(--brand); color: var(--brand-ink); }
  #close { background: var(--surface-2); color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    #text, #foto, #senden { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M4 20 L15 9 L18 12 Z"></path>
        <path d="M19 2 C19.3 4 20 4.7 22 5 C20 5.3 19.3 6 19 8 C18.7 6 18 5.3 16 5 C18 4.7 18.7 4 19 2 Z"></path>
      </svg>
      <h1>Koni-Notiz</h1>
    </div>
    <button id="gear" type="button" title="Einstellungen" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <div id="textwrap">
    <textarea id="text" autofocus placeholder="Was geht dir durch den Kopf?"></textarea>
    <button id="foto" type="button" title="Notiz fotografieren" aria-label="Notiz fotografieren">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </button>
    <input id="fotoInput" type="file" accept="image/*" capture="environment" hidden>
  </div>

  <select id="kontext">
    <option value="">Kein Kontext</option>
    <option value="soH">soH</option>
    <option value="KMU">KMU</option>
    <option value="Privat">Privat</option>
    <option value="Fragen an Dani">Fragen an Dani</option>
    <option value="Tasks">Tasks</option>
  </select>

  <button id="senden">Senden</button>
  <div id="status"></div>

  <dialog id="settings">
    <h2>Einstellungen</h2>
    <label for="token">GitHub Fine-grained PAT</label>
    <input id="token" type="password" placeholder="github_pat_...">
    <div class="row">
      <button id="close">Schliessen</button>
      <button id="save">Speichern</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
